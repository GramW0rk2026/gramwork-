<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>صفحه پیدا نشد | گرام ورک</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #1a1210; color: #f0e6d3; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    .logo { font-size: 32px; font-weight: 900; color: #e8956d; margin-bottom: 24px; }
    .logo span { color: #c4703f; }
    .code { font-size: 64px; font-weight: 900; color: #e8956d; }
    h1 { font-size: 18px; margin: 8px 0 24px; }
    p { font-size: 13px; color: #8a7060; margin-bottom: 24px; line-height: 1.8; }
    a { display: inline-block; background: #e8956d; color: #1a1210; padding: 14px 28px; border-radius: 14px; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <div class="logo">gram<span>work</span></div>
  <div class="code">۴۰۴</div>
  <h1>این صفحه پیدا نشد</h1>
  <p>آدرسی که وارد کردی وجود نداره یا جابه‌جا شده.</p>
  <a href="/">بازگشت به صفحه اصلی</a>
</body>
</html>
