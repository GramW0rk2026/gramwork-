<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>گرام ورک — پنل مدیریت</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f0a08; color: #f0e6d3; min-height: 100vh; }
    .page { display: none; min-height: 100vh; }
    .page.active { display: block; }
    .logo { font-size: 28px; font-weight: 900; color: #e8956d; }
    .logo span { color: #c4703f; }
    .header { background: #1a1008; padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d1f10; position: sticky; top: 0; z-index: 50; }
    .header-title { font-size: 17px; font-weight: 700; color: #f0e6d3; }
    .back-btn { font-size: 22px; color: #e8956d; cursor: pointer; }
    .navbar { position: fixed; bottom: 0; width: 100%; background: #1a1008; border-top: 1px solid #2d1f10; display: flex; justify-content: space-around; padding: 10px 0; z-index: 50; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; color: #8a7060; font-size: 10px; }
    .nav-item.active { color: #e8956d; }
    .nav-icon { font-size: 20px; }
    .page-content { padding-bottom: 80px; }
    .section { padding: 0 16px; margin-bottom: 20px; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .section-title { font-size: 15px; font-weight: 700; color: #f0e6d3; }
    .see-all { font-size: 13px; color: #e8956d; cursor: pointer; }
    .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; margin-bottom: 10px; font-family: inherit; }
    .btn-primary { background: #e8956d; color: #1a1210; }
    .btn-secondary { background: transparent; border: 1px solid #2d1f10; color: #8a7060; }
    .btn-danger { background: #4a1e1e; color: #e86d6d; }
    .btn-success { background: #2d4a1e; color: #7bc67e; }
    .btn-warn { background: #4a3010; color: #e8b56d; }
    .input-group { margin-bottom: 14px; }
    .input-group label { display: block; font-size: 13px; color: #a08060; margin-bottom: 7px; }
    .input-group input, .input-group textarea, .input-group select { width: 100%; padding: 12px 14px; background: #1a1008; border: 1px solid #2d1f10; border-radius: 11px; color: #f0e6d3; font-size: 14px; outline: none; text-align: right; font-family: inherit; }
    .input-group textarea { resize: none; height: 80px; }
    .input-group input:focus, .input-group textarea:focus { border-color: #e8956d; }
    .error-box { background: #3a1e1e; border: 1px solid #e86d6d44; border-radius: 10px; padding: 10px 14px; font-size: 13px; color: #e86d6d; margin-bottom: 12px; display: none; }
    .loading-box { text-align: center; font-size: 13px; color: #8a7060; margin-bottom: 12px; display: none; }
    .badge { font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: 600; }
    .badge-active { background: #2d4a1e; color: #7bc67e; }
    .badge-pending { background: #4a3010; color: #e8b56d; }
    .badge-done { background: #1e3a4a; color: #6db8e8; }
    .badge-dispute { background: #4a1e1e; color: #e86d6d; }
    .badge-new { background: #4a1e1e; color: #e86d6d; }
    .badge-review { background: #4a3010; color: #e8b56d; }
    .badge-resolved { background: #2d4a1e; color: #7bc67e; }
    .super-badge { background: #e8956d; color: #1a1210; font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 700; display: inline-block; margin-top: 4px; }
    .revenue-card { margin: 16px; background: linear-gradient(135deg, #3d2010, #2a1505); border: 1px solid #c4703f; border-radius: 20px; padding: 20px; }
    .revenue-label { font-size: 13px; color: #a08060; margin-bottom: 6px; }
    .revenue-amount { font-size: 26px; font-weight: 900; color: #e8956d; margin-bottom: 4px; }
    .revenue-amount span { font-size: 14px; color: #8a7060; }
    .revenue-note { font-size: 12px; color: #8a7060; margin-bottom: 14px; }
    .revenue-row { display: flex; gap: 10px; }
    .revenue-item { flex: 1; background: #1a120888; border-radius: 10px; padding: 10px; text-align: center; }
    .revenue-item-val { font-size: 14px; font-weight: 700; color: #e8956d; }
    .revenue-item-label { font-size: 11px; color: #8a7060; margin-top: 2px; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 16px 16px; }
    .stat-card { background: #1a1008; border: 1px solid #2d1f10; border-radius: 14px; padding: 14px; text-align: center; }
    .stat-icon { font-size: 22px; margin-bottom: 6px; }
    .stat-num { font-size: 20px; font-weight: 900; color: #e8956d; }
    .stat-label { font-size: 11px; color: #8a7060; margin-top: 3px; }
    .stat-change { font-size: 11px; color: #7bc67e; margin-top: 2px; }
    .alert-card { background: #2a1505; border: 1px solid #e8956d44; border-radius: 13px; padding: 13px; margin-bottom: 10px; display: flex; gap: 12px; align-items: center; cursor: pointer; }
    .alert-card.red { border-color: #e86d6d44; background: #2a0505; }
    .alert-icon { font-size: 22px; flex-shrink: 0; }
