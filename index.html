<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>گرام ورک</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #1a1210; color: #f0e6d3; min-height: 100vh; }

    /* ===== مشترک ===== */
    .page { display: none; min-height: 100vh; }
    .page.active { display: block; }
    .page-center { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .logo { font-size: 32px; font-weight: 900; color: #e8956d; }
    .logo span { color: #c4703f; }
    .btn { width: 100%; max-width: 360px; padding: 15px; border-radius: 14px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; margin-bottom: 12px; font-family: inherit; display: block; }
    .btn-primary { background: #e8956d; color: #1a1210; }
    .btn-secondary { background: transparent; border: 1px solid #3d2b20; color: #e8956d; }
    .btn-danger { background: transparent; border: 1px solid #e86d6d44; color: #e86d6d; }
    .btn:disabled { background: #3d2b20; color: #8a7060; cursor: not-allowed; }
    .input-group { margin-bottom: 16px; width: 100%; max-width: 360px; }
    .input-group label { display: block; font-size: 13px; color: #a08060; margin-bottom: 8px; }
    .input-group input, .input-group textarea, .input-group select { width: 100%; padding: 13px 16px; background: #2a1f1a; border: 1px solid #3d2b20; border-radius: 12px; color: #f0e6d3; font-size: 14px; outline: none; text-align: right; font-family: inherit; }
    .input-group textarea { resize: none; height: 90px; }
    .input-group input:focus, .input-group textarea:focus, .input-group select:focus { border-color: #e8956d; }
    .input-group select option { background: #2a1f1a; }
    .error-box { background: #3a1e1e; border: 1px solid #e86d6d44; border-radius: 10px; padding: 10px 14px; font-size: 13px; color: #e86d6d; margin-bottom: 12px; display: none; width: 100%; max-width: 360px; text-align: center; }
    .success-box { background: #1e3a1e; border: 1px solid #7bc67e44; border-radius: 10px; padding: 10px 14px; font-size: 13px; color: #7bc67e; margin-bottom: 12px; display: none; width: 100%; max-width: 360px; text-align: center; }
    .loading-box { text-align: center; font-size: 13px; color: #8a7060; margin-bottom: 12px; display: none; }
    .badge { font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: 600; }
    .badge-active { background: #2d4a1e; color: #7bc67e; }
    .badge-pending { background: #4a3010; color: #e8b56d; }
    .badge-done { background: #1e3a4a; color: #6db8e8; }
    .badge-canceled { background: #3a1e1e; color: #e86d6d; }
    .badge-new { background: #1e2a4a; color: #6d8de8; }
    .card { background: #2a1f1a; border: 1px solid #3d2b20; border-radius: 16px; padding: 16px; margin-bottom: 12px; }
    .section { padding: 0 16px; margin-bottom: 20px; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .section-title { font-size: 15px; font-weight: 700; color: #f0e6d3; }
    .see-all { font-size: 13px; color: #e8956d; cursor: pointer; }
    .header { background: #2a1f1a; padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3d2b20; position: sticky; top: 0; z-index: 50; }
    .header-title { font-size: 17px; font-weight: 700; color: #f0e6d3; }
    .back-btn { font-size: 22px; color: #e8956d; cursor: pointer; }
    .navbar { position: fixed; bottom: 0; width: 100%; background: #2a1f1a; border-top: 1px solid #3d2b20; display: flex; justify-content: space-around; padding: 10px 0; z-index: 50; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; color: #8a7060; font-size: 10px; }
    .nav-item.active { color: #e8956d; }
    .nav-icon { font-size: 20px; }
    .page-content { padding-bottom: 80px; }
    .wallet-card { margin: 16px; background: linear-gradient(135deg, #3d2010, #2a1505); border: 1px solid #c4703f; border-radius: 20px; padding: 20px; }
    .wallet-label { font-size: 13px; color: #a08060; margin-bottom: 6px; }
    .wallet-amount { font-size: 28px; font-weight: 900; color: #e8956d; margin-bottom: 4px; }
    .wallet-amount span { font-size: 14px; color: #8a7060; }
    .wallet-note { font-size: 12px; color: #8a7060; margin-bottom: 16px; }
    .wallet-note b { color: #e8b56d; }
    .wallet-actions { display: flex; gap: 10px; }
    .wallet-btn { flex: 1; padding: 11px; border-radius: 11px; border: none; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
    .wallet-btn-charge { background: #e8956d; color: #1a1210; }
    .wallet-btn-withdraw { background: transparent; border: 1px solid #e8956d; color: #e8956d; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 0 16px 20px; }
    .stat-card { background: #2a1f1a; border: 1px solid #3d2b20; border-radius: 14px; padding: 14px; text-align: center; }
    .stat-icon { font-size: 22px; margin-bottom: 6px; }
    .stat-num { font-size: 20px; font-weight: 900; color: #e8956d; }
    .stat-label { font-size: 11px; color: #8a7060; margin-top: 3px; }
    .project-card { background: #2a1f1a; border: 1px solid #3d2b20; border-radius: 14px; padding: 14px; margin-bottom: 10px; cursor: pointer; }
